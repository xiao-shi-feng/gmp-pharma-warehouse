<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GMP 药品仓库合规知识库</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#060b18;color:#e2e8f0;font-family:'Inter',-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;line-height:1.6}
.header{background:rgba(6,11,24,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(59,130,246,0.12);position:sticky;top:0;z-index:100}
.header-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:24px}
.logo h1{font-size:16px;font-weight:600}
.logo span{font-size:11px;color:#546079;letter-spacing:1px}
.container{max-width:1200px;margin:0 auto;padding:24px}
.search-wrap{margin-bottom:24px}
.search-bar{display:flex;gap:8px;margin-bottom:12px}
.search-input{flex:1;padding:12px 16px;background:rgba(255,255,255,0.04);border:1px solid rgba(59,130,246,0.12);border-radius:8px;color:#e2e8f0;font-size:14px;outline:none;font-family:inherit}
.search-input:focus{border-color:#3b82f6}
.search-tabs{display:flex;gap:4px;margin-bottom:8px}
.search-tab{padding:6px 16px;border:1px solid rgba(59,130,246,0.12);border-radius:6px 6px 0 0;background:transparent;color:#546079;font-size:12px;cursor:pointer;font-family:inherit;border-bottom-color:#060b18}
.search-tab.active{color:#3b82f6;background:rgba(59,130,246,0.06);border-color:#3b82f6}
.search-btn{padding:12px 24px;background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;font-family:inherit}
.search-btn:hover{opacity:0.9}
.categories{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.cat-btn{padding:4px 12px;border:1px solid rgba(59,130,246,0.12);border-radius:4px;background:transparent;color:#8896b0;font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.2s}
.cat-btn:hover,.cat-btn.active{color:#3b82f6;border-color:#3b82f6;background:rgba(59,130,246,0.06)}

.result-card{background:rgba(15,23,42,0.5);border:1px solid rgba(59,130,246,0.12);border-radius:10px;padding:20px;margin-bottom:12px}
.result-card:hover{border-color:rgba(59,130,246,0.2)}
.result-meta{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.result-module{font-size:11px;color:#3b82f6;background:rgba(59,130,246,0.08);padding:2px 10px;border-radius:4px}
.result-title{font-size:16px;font-weight:600;margin-bottom:6px}
.result-content{font-size:13px;color:#8896b0;line-height:1.8}
.result-keys{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.result-key{font-size:10px;color:#546079;padding:1px 6px;background:rgba(255,255,255,0.03);border-radius:3px}
.welcome{text-align:center;padding:60px 20px}
.welcome-icon{font-size:48px;margin-bottom:16px}
.welcome h2{font-size:22px;margin-bottom:8px;background:linear-gradient(135deg,#3b82f6,#6366f1);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.welcome p{color:#8896b0;font-size:14px}
.welcome-cats{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.welcome-cat{background:rgba(15,23,42,0.5);border:1px solid rgba(59,130,246,0.12);border-radius:8px;padding:10px 14px;font-size:12px;color:#8896b0;cursor:pointer;transition:all 0.2s}
.welcome-cat:hover{border-color:#3b82f6;color:#e2e8f0}
.answer-card{background:linear-gradient(135deg,rgba(34,197,94,0.04),rgba(59,130,246,0.04));border:1px solid rgba(34,197,94,0.15);border-radius:10px;padding:24px;margin-bottom:16px}
.answer-label{font-size:11px;color:#22c55e;font-weight:600;margin-bottom:8px;letter-spacing:1px}
.answer-text{font-size:14px;line-height:1.9}
.stats{font-size:11px;color:#546079;padding:2px 10px;background:rgba(255,255,255,0.03);border-radius:4px}
.module-detail{animation:fadeIn 0.3s}
.module-detail h2{font-size:20px;font-weight:600;margin-bottom:20px;color:#3b82f6}
.detail-card{background:rgba(15,23,42,0.5);border:1px solid rgba(59,130,246,0.12);border-radius:10px;padding:20px;margin-bottom:12px}
.detail-card h3{font-size:15px;font-weight:600;margin-bottom:8px}
.detail-card p{font-size:13px;color:#8896b0;line-height:1.8}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.loading{text-align:center;padding:40px;color:#546079}
@media(max-width:768px){.search-bar{flex-direction:column}}
</style>
</head>
<body>
<div class="header">
  <div class="header-inner">
    <div class="logo">
      <span class="logo-icon">💊</span>
      <div><h1>GMP 药品仓库合规知识库</h1><span>Knowledge Base · Search · Q&A</span></div>
    </div>
    <span class="stats" id="headerStats"></span>
  </div>
</div>

<div class="container">
  <div class="search-wrap">
    <div class="search-tabs">
      <button class="search-tab active" onclick="switchMode('search')">🔍 搜索</button>
      <button class="search-tab" onclick="switchMode('ask')">💬 问答</button>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="输入关键词搜索 GMP/GSP 知识库..." onkeydown="if(event.key==='Enter')doSearch()">
      <button class="search-btn" onclick="doSearch()">搜索</button>
    </div>
    <div class="categories" id="categories"></div>
  </div>
  <div id="results">
    <div class="welcome" id="welcome">
      <div class="welcome-icon">🏥</div>
      <h2>GMP 药品仓库合规知识库</h2>
      <p id="welcomeDesc">加载中...</p>
      <div class="welcome-cats" id="welcomeCats"></div>
    </div>
  </div>
</div>

<script>
// ============ 数据 ============
var MODULES = [];
var ENTRIES = [];
var currentMode = 'search';
var allModulesLoaded = false;

// ============ 加载数据 ============
function loadData() {
  Promise.all([
    fetch('static-data/modules.json').then(function(r){return r.json()}),
    fetch('static-data/entries.json').then(function(r){return r.json()}),
    fetch('static-data/overview.json').then(function(r){return r.json()})
  ]).then(function(results) {
    MODULES = results[0].modules;
    ENTRIES = results[1].entries;
    var overview = results[2];
    allModulesLoaded = true;

    document.getElementById('headerStats').textContent = overview.total_modules + ' 模块 · ' + overview.total_entries + ' 条';
    document.getElementById('welcomeDesc').textContent = '覆盖 ' + overview.total_modules + ' 个知识模块，共 ' + overview.total_entries + ' 条专业内容';

    // 分类按钮
    var cats = document.getElementById('categories');
    cats.innerHTML = '<button class="cat-btn active" onclick="showAll()">📋 全部模块</button>';
    overview.modules.forEach(function(m) {
      var btn = document.createElement('button');
      btn.className = 'cat-btn';
      btn.textContent = m;
      btn.onclick = function(){ showModule(m) };
      cats.appendChild(btn);
    });

    // 欢迎页模块卡片
    var wc = document.getElementById('welcomeCats');
    overview.modules.forEach(function(m) {
      var card = document.createElement('div');
      card.className = 'welcome-cat';
      card.textContent = m;
      card.onclick = function(){ showModule(m) };
      wc.appendChild(card);
    });
  });
}

// ============ 搜索 ============
function doSearch() {
  var q = document.getElementById('searchInput').value.trim();
  if (!q || !allModulesLoaded) return;

  var qLower = q.toLowerCase();
  var qWords = qLower.match(/[\w\u4e00-\u9fff]+/g) || [];

  var results = [];
  ENTRIES.forEach(function(e) {
    var score = 0;
    var cLower = e.content.toLowerCase();
    var tLower = e.title.toLowerCase();
    qWords.forEach(function(w) {
      if (tLower.indexOf(w) !== -1) score += 10;
      if (e.module.indexOf(w) !== -1) score += 5;
      var count = (cLower.match(new RegExp(w.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g')) || []).length;
      score += count * 2;
      (e.keywords||[]).forEach(function(kw) {
        if (kw.toLowerCase().indexOf(w) !== -1) score += 3;
      });
    });
    if (score > 0) results.push({score:score, entry:e});
  });
  results.sort(function(a,b){return b.score - a.score});

  var container = document.getElementById('results');
  var html = '';

  if (currentMode === 'ask' && results.length > 0) {
    var primary = results[0].entry;
    html += '<div class="answer-card"><div class="answer-label">💬 AI 回答</div>';
    html += '<div class="answer-text">根据《' + primary.module + '》相关规定：<br><br>' + primary.content.substring(0, 500);
    html += '</div></div>';
    html += '<div style="font-size:12px;color:#546079;margin-bottom:12px">📋 参考来源：<span style="color:#3b82f6">' + primary.module + '</span> › ' + primary.title + '</div>';
  } else if (results.length > 0) {
    html += '<div style="font-size:12px;color:#546079;margin-bottom:12px">共 ' + results.length + ' 条结果</div>';
    results.forEach(function(r) {
      var e = r.entry;
      html += '<div class="result-card">';
      html += '<div class="result-meta"><span class="result-module">' + e.module + '</span></div>';
      html += '<div class="result-title">' + e.title + '</div>';
      html += '<div class="result-content">' + (e.summary || e.content.substring(0,200)) + '</div>';
      if (e.keywords && e.keywords.length) {
        html += '<div class="result-keys">' + e.keywords.slice(0,8).map(function(k){return '<span class="result-key">#'+k+'</span>'}).join('') + '</div>';
      }
      html += '</div>';
    });
  } else {
    html = '<div class="welcome"><div style="font-size:48px;margin-bottom:16px">🔍</div><p style="color:#546079">未找到匹配结果，请尝试其他关键词</p></div>';
  }
  container.innerHTML = html;
}

// ============ 显示模块 ============
function showModule(name) {
  var container = document.getElementById('results');
  container.innerHTML = '<div class="loading">加载中...</div>';

  var mod = MODULES.find(function(m){return m.name === name});
  if (!mod) return;

  var html = '<div class="module-detail"><h2>📂 ' + mod.name + '</h2>';
  html += '<p style="color:#8896b0;font-size:13px;margin-bottom:20px">共 ' + mod.entries.length + ' 条内容</p>';
  mod.entries.forEach(function(e) {
    html += '<div class="detail-card"><h3>' + e.title + '</h3><p>' + e.content + '</p>';
    if (e.keywords && e.keywords.length) {
      html += '<div class="result-keys">' + e.keywords.slice(0,8).map(function(k){return '<span class="result-key">#'+k+'</span>'}).join('') + '</div>';
    }
    html += '</div>';
  });
  html += '</div>';
  container.innerHTML = html;
}

function showAll() {
  document.getElementById('results').innerHTML = document.getElementById('welcome').outerHTML;
}

function switchMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.search-tab').forEach(function(t){t.classList.toggle('active',t.textContent.indexOf(mode==='ask'?'问答':'搜索')!==-1)});
  document.getElementById('searchInput').placeholder = mode === 'ask' ? '输入问题，AI 基于知识库回答...' : '输入关键词搜索 GMP/GSP 知识库...';
}

loadData();
</script>
</body>
</html>
